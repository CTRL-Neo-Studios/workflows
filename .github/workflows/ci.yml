name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # typecheck runs vue-tsc on the pinned devDependency typescript@6.0.3, the minimum in peerDependencies,
      # and TypeScript 7 on src/core.
      - run: bun run check
      - run: bun run build
