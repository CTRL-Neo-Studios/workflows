name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      # Keep in sync with peerDependencies.typescript (minimum supported version).
      - run: bunx -p typescript@6.0.3 tsc --noEmit
      - run: bun run build
